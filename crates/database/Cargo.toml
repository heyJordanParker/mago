[package]
name = "mago-database"
description = "Provides a high-performance, in-memory database for source code analysis, featuring distinct mutable and immutable states and transactional updates."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
memchr = { workspace = true }
glob = { workspace = true, optional = true }
tracing = { workspace = true }
walkdir = { workspace = true, optional = true }
foldhash = { workspace = true }
globset = { workspace = true }
serde = { workspace = true, features = ["rc"], optional = true }
serde_json = { workspace = true, optional = true }
rayon = { workspace = true }
notify = { workspace = true, optional = true }

[features]
default = ["loader", "watcher"]
serde = ["dep:serde"]
loader = ["dep:glob", "dep:walkdir", "dep:serde_json"]
watcher = ["loader", "dep:notify"]

[dev-dependencies]
tempfile = { workspace = true }
